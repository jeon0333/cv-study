<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="일반 블록은 x를 변환해 H(x)를 만들고, 잔차 블록은 F(x)와 x를 더해 H(x)를 만든다">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect x="15" y="14" width="425" height="350" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="500" y="14" width="425" height="350" rx="22" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#0f172a"><text x="227" y="60" text-anchor="middle">일반 블록</text><text x="712" y="60" text-anchor="middle">잔차 블록 (ResNet)</text></g>
<g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" fill="#0f172a" text-anchor="middle"><text x="227" y="102">입력 x</text><text x="712" y="102">입력 x</text></g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M227 116 V158"/><path d="M227 228 V280"/><path d="M712 116 V152"/><path d="M712 228 V269"/><path d="M712 304 V323"/><path d="M712 123 H868 V286 H755"/></g>
<rect x="112" y="158" width="230" height="70" rx="14" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
<rect x="592" y="158" width="240" height="70" rx="14" fill="#c7d2fe" stroke="#818cf8" stroke-width="2"/>
<g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" text-anchor="middle" fill="#1e1b4b"><text x="227" y="187">Conv, BN, ReLU …</text><text x="227" y="212" font-size="17">직접 H(x) 학습</text><text x="712" y="187">Conv, BN, ReLU …</text><text x="712" y="212" font-size="17">변화량 F(x) 학습</text></g>
<circle cx="712" cy="287" r="20" fill="#fff" stroke="#4f46e5" stroke-width="3"/><text x="712" y="295" font-family="Arial" font-size="28" fill="#4f46e5" text-anchor="middle">+</text>
<g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" text-anchor="middle" fill="#0f172a"><text x="227" y="309">출력 H(x)</text><text x="712" y="349">출력 H(x) = F(x) + x</text></g>
<text x="864" y="199" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#4338ca" text-anchor="middle">지름길</text><text x="864" y="217" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#4338ca" text-anchor="middle">(shortcut)</text>
</svg>
